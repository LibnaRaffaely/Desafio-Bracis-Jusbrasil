[project]
name = "citacoes"
version = "0.1.0"
description = "Verificador de citações jurídicas — Desafio BRACIS 2026 (Jusbrasil)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2",
    "langchain-core>=1.6",
    "pydantic>=2.7",
    "pandas>=2.2",
    "regex>=2024.5.15",
    "rapidfuzz>=3.9",
    "unidecode>=1.3",
]

[project.optional-dependencies]
# Só se a análise de erro justificar os agentes LLM (llama-cpp-python compila na instalação)
llm = [
    "langchain-community>=0.4",
    "llama-cpp-python>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "ipykernel>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citacoes"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
